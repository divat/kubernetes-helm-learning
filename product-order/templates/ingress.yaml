{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "product-order.fullname" . }}-ingress
  labels:
    {{- include "product-order.labels" . | nindent 4 }}

spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: {{ include "product-order.fullname" . }}-product-api
                port:
                  number: {{ .Values.productApi.service.port }}

          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: {{ include "product-order.fullname" . }}-order-service
                port:
                  number: {{ .Values.orderService.service.port }}
{{- end }}
