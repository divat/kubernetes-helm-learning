apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "product-order.fullname" . }}-order-service
  labels:
    {{- include "product-order.labels" . | nindent 4 }}
    app: order-service

spec:
  replicas: {{ .Values.orderService.replicas }}

  selector:
    matchLabels:
      app: order-service
      {{- include "product-order.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        app: order-service
        {{- include "product-order.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: order-service
          image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: {{ .Values.orderService.containerPort }}

          env:
            - name: DB_HOST
              value: {{ .Values.postgres.host | quote }}

            - name: DB_PORT
              value: {{ .Values.postgres.port | quote }}

            - name: DB_NAME
              value: {{ .Values.orderService.database.name | quote }}

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: POSTGRES_PASSWORD

            - name: PRODUCT_API_BASE_URL
              value: "http://{{ include "product-order.fullname" . }}-product-api:{{ .Values.productApi.service.port }}"
